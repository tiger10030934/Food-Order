<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迪哥點餐系統</title>
  <!-- 引入 Tailwind CSS 美化介面 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-5 flex justify-center min-h-screen items-center">

  <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md my-6">
    <h1 class="text-2xl font-bold text-center text-slate-800 mb-6">👦 迪哥點餐系統</h1>
    
    <!-- 成功提示橫幅 (預設隱藏) -->
    <div id="successMessage" class="hidden mb-6 p-4 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl text-center font-medium">
      🎉 點餐成功！已經幫你記下來囉！
    </div>

    <form id="orderForm" class="space-y-6">
      <!-- 填寫姓名 -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">你的名字</label>
        <input type="text" id="name" required placeholder="請輸入名字" 
               class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- 選擇今日餐點 -->
      <div class="space-y-4">
        <label class="block text-gray-700 font-medium text-lg">選擇今日餐點</label>
        
        <!-- 水果區域 (由 API 動態渲染) -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
          <span class="block font-semibold text-slate-700 mb-2">🍎 水果專區</span>
          
          <!-- 載入中狀態 -->
          <div id="loadingText" class="text-gray-500 text-sm p-2 text-center">
            ⏳ 正在載入今日水果清單...
          </div>

          <!-- 動態水果勾選清單 -->
          <div id="fruitList" class="grid grid-cols-1 gap-2 hidden">
            <!-- 勾選項目會由 JavaScript 自動塞入這裡 -->
          </div>
        </div>

        <!-- 🆕 其他 / 自訂餐點區域 -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
          <span class="block font-semibold text-slate-700 mb-1">✨ 其他想吃的</span>
          <input type="text" id="customItem" placeholder="請輸入其他品項" 
                 class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <p class="text-xs text-gray-400">若有其他想點的東西可直接輸入於此，會與勾選項目一同送出。</p>
        </div>
      </div>

      <!-- 送出按鈕 -->
      <button type="submit" id="submitBtn" disabled
              class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
        載入中...
      </button>
    </form>
  </div>

  <script>
    // ⚠️ 記得確認這裡的 SCRIPT_URL 是否正確
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxHcd8e8UXfh-vCNoGfr5aNJ0Y33EdmT4kydPgTSYKwBx5o54R-QBw_j4QZ1gL-RwlNWw/exec';

    // 頁面載入時，自動去 Google 試算表抓取「今天有勾選的水果」
    window.addEventListener('DOMContentLoaded', async () => {
      const fruitList = document.getElementById('fruitList');
      const loadingText = document.getElementById('loadingText');
      const submitBtn = document.getElementById('submitBtn');

      try {
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();

        if (result.status === 'success' && result.items.length > 0) {
          loadingText.classList.add('hidden');
          fruitList.innerHTML = ''; 

          // 動態生成水果選項
          result.items.forEach(item => {
            const label = document.createElement('label');
            label.className = 'flex items-center gap-3 p-2.5 bg-white border rounded-lg hover:bg-slate-100 cursor-pointer';
            label.innerHTML = `
              <input type="checkbox" name="item" value="${item}" class="w-5 h-5 accent-blue-600">
              <span class="text-gray-700">${item}</span>
            `;
            fruitList.appendChild(label);
          });

          fruitList.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerText = '送出點餐';
        } else {
          loadingText.innerText = '⚠️ 今天迪哥沒有提供水果，或菜單未設定喔！';
          submitBtn.disabled = false;
          submitBtn.innerText = '送出點餐 (僅送出其他自訂項目)';
        }
      } catch (err) {
        console.error(err);
        loadingText.innerText = '⚠️ 無法載入菜單，請重新整理試試看！';
      }
    });

    // 表單送出處理
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      
      // 收集所有勾選的水果
      const selectedItems = Array.from(document.querySelectorAll('input[name="item"]:checked'))
                                 .map(el => el.value);

      // 收集使用者在「其他」欄位輸入的內容
      const customText = document.getElementById('customItem').value.trim();
      if (customText) {
        selectedItems.push(`其他：${customText}`); // 加上標籤讓試算表更好辨識
      }

      // 防呆：如果水果沒勾，且「其他」也沒填
      if (selectedItems.length === 0) {
        alert('請至少選擇一項水果，或在其他欄位輸入想吃的東西！');
        return;
      }

      const btn = document.getElementById('submitBtn');
      const successMsg = document.getElementById('successMessage');
      
      btn.disabled = true;
      btn.innerText = '傳送中...';
      successMsg.classList.add('hidden');

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, items: selectedItems })
        });

        successMsg.classList.remove('hidden');
        document.getElementById('orderForm').reset();
      } catch (err) {
        alert('點餐失敗，請稍後再試。');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = '送出點餐';
      }
    });
  </script>
</body>
</html>
