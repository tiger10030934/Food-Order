<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迪哥點餐系統</title>
  <!-- 引入 Tailwind CSS 美化介面 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-5 flex justify-center min-h-screen items-center">

  <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md my-6">
    <h1 class="text-2xl font-bold text-center text-slate-800 mb-6">👦 迪哥點餐系統</h1>
    
    <form id="orderForm" class="space-y-6">
      <!-- 填寫姓名 -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">你的名字</label>
        <input type="text" id="name" required placeholder="請輸入名字" 
               class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- 選擇今日餐點 -->
      <div>
        <label class="block text-gray-700 font-medium mb-2 text-lg">選擇今日餐點</label>
        
        <!-- 水果區域 -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
          <span class="block font-semibold text-slate-700 mb-2">🍎 水果專區</span>
          <div class="grid grid-cols-1 gap-2">
            <label class="flex items-center gap-3 p-2.5 bg-white border rounded-lg hover:bg-slate-100 cursor-pointer">
              <input type="checkbox" name="item" value="🍌 香蕉" class="w-5 h-5 accent-blue-600">
              <span class="text-gray-700">🍌 香蕉</span>
            </label>
            <label class="flex items-center gap-3 p-2.5 bg-white border rounded-lg hover:bg-slate-100 cursor-pointer">
              <input type="checkbox" name="item" value="🍎 樂淇蘋果" class="w-5 h-5 accent-blue-600">
              <span class="text-gray-700">🍎 樂淇蘋果</span>
            </label>
            <label class="flex items-center gap-3 p-2.5 bg-white border rounded-lg hover:bg-slate-100 cursor-pointer">
              <input type="checkbox" name="item" value="🍎 艾菲蘋果" class="w-5 h-5 accent-blue-600">
              <span class="text-gray-700">🍎 艾菲蘋果</span>
            </label>
            <label class="flex items-center gap-3 p-2.5 bg-white border rounded-lg hover:bg-slate-100 cursor-pointer">
              <input type="checkbox" name="item" value="🫐 藍莓" class="w-5 h-5 accent-blue-600">
              <span class="text-gray-700">🫐 藍莓</span>
            </label>
            <label class="flex items-center gap-3 p-2.5 bg-white border rounded-lg hover:bg-slate-100 cursor-pointer">
              <input type="checkbox" name="item" value="🥑 酪梨" class="w-5 h-5 accent-blue-600">
              <span class="text-gray-700">🥑 酪梨</span>
            </label>
            <label class="flex items-center gap-3 p-2.5 bg-white border rounded-lg hover:bg-slate-100 cursor-pointer">
              <input type="checkbox" name="item" value="🍊 茂谷柑" class="w-5 h-5 accent-blue-600">
              <span class="text-gray-700">🍊 茂谷柑</span>
            </label>
            <label class="flex items-center gap-3 p-2.5 bg-white border rounded-lg hover:bg-slate-100 cursor-pointer">
              <input type="checkbox" name="item" value="🟡 百香果" class="w-5 h-5 accent-blue-600">
              <span class="text-gray-700">🟡 百香果</span>
            </label>
            <label class="flex items-center gap-3 p-2.5 bg-white border rounded-lg hover:bg-slate-100 cursor-pointer">
              <input type="checkbox" name="item" value="🍇 綠無籽葡萄" class="w-5 h-5 accent-blue-600">
              <span class="text-gray-700">🍇 綠無籽葡萄</span>
            </label>
          </div>
        </div>

        <!-- 其他餐點區域（若之後有其他餐點或便當可以加在這裡） -->
        <!-- 
        <div class="mt-4 bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
          <span class="block font-semibold text-slate-700 mb-2">🍱 主餐 / 飲料專區</span>
          <label class="flex items-center gap-3 p-2.5 bg-white border rounded-lg hover:bg-slate-100 cursor-pointer">
            <input type="checkbox" name="item" value="🍱 雞肉便當" class="w-5 h-5 accent-blue-600">
            <span class="text-gray-700">🍱 雞肉便當</span>
          </label>
        </div>
        -->
      </div>

      <!-- 送出按鈕 -->
      <button type="submit" id="submitBtn" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
        送出點餐
      </button>
    </form>
  </div>

  <script>
    // ⚠️ 記得替換成你的 Google Apps Script Web API 網址
    const SCRIPT_URL = 'https://script.google.com/macros/s/你的API關鍵字/exec';

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      const selectedItems = Array.from(document.querySelectorAll('input[name="item"]:checked'))
                                 .map(el => el.value);

      if (selectedItems.length === 0) {
        alert('請至少選擇一項餐點或水果！');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = '傳送中...';

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, items: selectedItems })
        });

        alert('點餐成功！已經幫你記下來囉！');
        document.getElementById('orderForm').reset();
      } catch (err) {
        alert('點餐失敗，請稍後再試。');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = '送出點餐';
      }
    });
  </script>
</body>
</html>
