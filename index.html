<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迪哥點餐系統</title>
  <!-- 引入 Tailwind CSS 美化介面 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-5 flex justify-center min-h-screen items-center">

  <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md my-6">
    <h1 class="text-2xl font-bold text-center text-slate-800 mb-6">👦 迪哥點餐系統</h1>

    <form id="orderForm" class="space-y-6">
      <!-- 填寫姓名 -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">你的名字</label>
        <input type="text" id="name" required placeholder="請輸入名字" 
               class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- 選擇今日餐點 -->
      <div class="space-y-4">
        <label class="block text-gray-700 font-medium text-lg">選擇今日餐點</label>
        
        <!-- 水果區域 (由 API 動態渲染) -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
          <span class="block font-semibold text-slate-700 mb-2">🍎 水果專區 (勾選後可調整數量)</span>
          
          <!-- 載入中狀態 -->
          <div id="loadingText" class="text-gray-500 text-sm p-2 text-center">
            ⏳ 正在載入今日水果清單...
          </div>

          <!-- 動態水果勾選清單 -->
          <div id="fruitList" class="space-y-2 hidden">
            <!-- 勾選項目會由 JavaScript 自動塞入這裡 -->
          </div>
        </div>

        <!-- 其他 / 自訂餐點區域 -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
          <span class="block font-semibold text-slate-700 mb-1">✨ 其他想吃的</span>
          <input type="text" id="customItem" placeholder="上面沒有想吃的嗎？請輸入其他品項..." 
                 class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <!-- 送出按鈕 -->
      <button type="submit" id="submitBtn" disabled
              class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
        載入中...
      </button>

      <!-- 🆕 點餐成功明細橫幅 (放在最底部、按鈕下方) -->
      <div id="successMessage" class="hidden p-4 bg-emerald-50 border border-emerald-200 rounded-xl space-y-2">
        <div class="text-emerald-800 font-bold text-center">🎉 點餐成功！已為你記錄以下內容：</div>
        <div id="successDetails" class="text-sm text-emerald-700 bg-white p-3 rounded-lg border border-emerald-100 space-y-1">
          <!-- 這裡會動態塞入剛才點的品項 -->
        </div>
      </div>
    </form>
  </div>

  <script>
    // 已自動帶入你的 Apps Script 網址
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxHcd8e8UXfh-vCNoGfr5aNJ0Y33EdmT4kydPgTSYKwBx5o54R-QBw_j4QZ1gL-RwlNWw/exec';

    // 頁面載入時，自動去 Google 試算表抓取「今天有勾選的水果」
    window.addEventListener('DOMContentLoaded', async () => {
      const fruitList = document.getElementById('fruitList');
      const loadingText = document.getElementById('loadingText');
      const submitBtn = document.getElementById('submitBtn');

      try {
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();

        if (result.status === 'success' && result.items.length > 0) {
          loadingText.classList.add('hidden');
          fruitList.innerHTML = ''; 

          // 動態生成水果選項
          result.items.forEach(item => {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex items-center justify-between p-2.5 bg-white border rounded-lg hover:bg-slate-50';
            
            wrapper.innerHTML = `
              <label class="flex items-center gap-3 cursor-pointer flex-grow">
                <input type="checkbox" name="fruitCheckbox" value="${item}" class="fruit-checkbox w-5 h-5 accent-blue-600">
                <span class="text-gray-700">${item}</span>
              </label>
              <select name="fruitQty" class="qty-select hidden border border-gray-300 rounded-md p-1 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="1">1 份</option>
                <option value="2">2 份</option>
                <option value="3">3 份</option>
              </select>
            `;

            const checkbox = wrapper.querySelector('.fruit-checkbox');
            const selectTag = wrapper.querySelector('.qty-select');

            checkbox.addEventListener('change', () => {
              if (checkbox.checked) {
                selectTag.classList.remove('hidden');
              } else {
                selectTag.classList.add('hidden');
                selectTag.value = "1";
              }
            });

            fruitList.appendChild(wrapper);
          });

          fruitList.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerText = '送出點餐';
        } else {
          loadingText.innerText = '⚠️ 今天迪哥沒有提供水果，或菜單未設定喔！';
          submitBtn.disabled = false;
          submitBtn.innerText = '送出點餐 (僅送出其他自訂項目)';
        }
      } catch (err) {
        console.error(err);
        loadingText.innerText = '⚠️ 無法載入菜單，請重新整理試試看！';
      }
    });

    // 表單送出處理
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      const selectedItems = [];
      const displaySummary = []; // 用於畫面上呈現的明細

      // 收集所有勾選的水果及其數量
      const fruitRows = document.querySelectorAll('#fruitList > div');
      fruitRows.forEach(row => {
        const checkbox = row.querySelector('.fruit-checkbox');
        const selectTag = row.querySelector('.qty-select');
        
        if (checkbox.checked) {
          const fruitName = checkbox.value;
          const qty = selectTag.value;
          selectedItems.push(`${fruitName} x${qty}`);
          displaySummary.push(`• ${fruitName} × ${qty} 份`);
        }
      });

      // 收集「其他」欄位
      const customText = document.getElementById('customItem').value.trim();
      if (customText) {
        selectedItems.push(`其他：${customText}`);
        displaySummary.push(`• 其他自訂：${customText}`);
      }

      if (selectedItems.length === 0) {
        alert('請至少選擇一項水果，或在其他欄位輸入想吃的東西！');
        return;
      }

      const btn = document.getElementById('submitBtn');
      const successMsg = document.getElementById('successMessage');
      const successDetails = document.getElementById('successDetails');
      
      btn.disabled = true;
      btn.innerText = '傳送中...';
      successMsg.classList.add('hidden');

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, items: selectedItems })
        });

        // 填入剛剛點選的明細內容
        successDetails.innerHTML = `
          <div><b>點餐人：</b>${name}</div>
          <div class="mt-1"><b>已送出品項：</b></div>
          <div class="pl-2">${displaySummary.join('<br>')}</div>
        `;

        // 顯示在最底部的成功橫幅
        successMsg.classList.remove('hidden');
        
        // 重置表單
        document.getElementById('orderForm').reset();
        document.querySelectorAll('.qty-select').forEach(el => el.classList.add('hidden'));

        // 自動平滑捲動到最底部讓使用者一眼看到成功明細
        successMsg.scrollIntoView({ behavior: 'smooth' });

      } catch (err) {
        alert('點餐失敗，請稍後再試。');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = '送出點餐';
      }
    });
  </script>
</body>
</html>
